<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>De compras · U, V y T</title>
<style>
:root{--bg:#f6f8f9;--tx:#1d2b33;--card:#fff;--ln:#9aa9b2;--c:#0f7b7b;--w:#c2410c;--ok:#15803d;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191d;--tx:#e6edf0;--card:#1b262c;--ln:#5d707a;--c:#4fc3c3;--w:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12191d;--tx:#e6edf0;--card:#1b262c;--ln:#5d707a;--c:#4fc3c3;--w:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:1.1rem/1.5 "Trebuchet MS",sans-serif;padding:1rem;-webkit-user-select:none;user-select:none}
main{max-width:40rem;margin:auto}
h1{font:bold 1.5rem Georgia,serif;margin:.2rem 0 .6rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
button{font:inherit;cursor:pointer;border:2px solid var(--c);background:var(--card);color:var(--tx);border-radius:.6rem;padding:.45rem .8rem;min-height:2.8rem}
button.on,button.pri{background:var(--c);color:#fff}
.sc{font-size:.95rem;color:var(--ln);margin:.2rem 0 .6rem}
.chips{display:flex;gap:.5rem;margin:.3rem 0}
.chip{flex:1;text-align:center;background:var(--card);border:2px solid var(--ln);border-radius:.6rem;padding:.3rem;font-weight:bold}
.chip.q{border-color:var(--w);color:var(--w);border-style:dashed}
.chip small{display:block;font-weight:normal;font-size:.75rem;color:var(--ln)}
.card{background:var(--card);border-left:6px solid var(--c);border-radius:.5rem;padding:.7rem 1rem;margin:.7rem 0}
.card.w{border-color:var(--w)}
.t{width:1.7rem;height:1.7rem;display:block}
.t[data-src]{touch-action:none;cursor:grab}
.ghost{position:fixed;pointer-events:none;z-index:9;width:2rem;height:2rem}
.pool{display:flex;flex-wrap:wrap;gap:.1rem;border:2px dashed var(--ln);border-radius:.6rem;padding:.4rem;min-height:3.2rem;margin:.5rem 0}
.pool .sc{margin:0;align-self:center}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:flex-start;margin:.8rem 0 .4rem}
.it{display:flex;flex-direction:column;align-items:center;width:3.7rem}
.bx{width:100%;min-height:2.8rem;display:flex;flex-direction:column;align-items:center;border:2px solid var(--c);border-radius:.3rem .3rem .8rem .8rem;padding:.3rem 0;background:var(--card)}
.em{font-size:1.8rem;line-height:1.2}
.newc{width:3.7rem;min-height:4.5rem;border:2px dashed var(--ln);border-radius:.6rem;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;line-height:1.2;color:var(--ln);cursor:pointer}
.ctl{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.ans{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.ans output{font:bold 2rem Georgia,serif;min-width:2.5rem;text-align:center}
.msg{font-weight:bold;margin:.5rem 0}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.eq{font:bold 1.5rem Georgia,serif;margin:.3rem 0}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="co" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#f1c232" stroke="#b8860b" stroke-width="1.2"/><circle cx="10" cy="10" r="6.5" fill="none" stroke="#d9a21b"/><text x="10" y="13.6" text-anchor="middle" font-size="10" font-weight="bold" font-family="Georgia,serif" fill="#7a5600">€</text></symbol>
</defs></svg>
<main>
<h1>🛒 De compras</h1>
<div class="tabs" id="tabs"></div>
<div class="sc" id="sc"></div>
<div id="app"></div>
</main>
<script>
var P=[['cuaderno','cuadernos','📒'],['bocadillo','bocadillos','🥪'],['libro','libros','📚'],['helado','helados','🍦'],['balón','balones','⚽'],['bolígrafo','bolígrafos','🖊️']];
var S={lv:1,lt:{},ord:[],mode:'mix',ok:0,streak:0,ch:null,c:[],pool:0,ans:0,done:false,rA:false,rB:null};
var $=function(i){return document.getElementById(i)};
var NM={T:'Precio de la compra',U:'Precio de cada artículo',V:'Artículos'};
function R(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function coin(n,s){var o='',i;for(i=0;i<n;i++)o+='<svg class="t"'+(s===null?'':' data-src="'+s+'"')+'><use href="#co"/></svg>';return o}
function setMode(m){S.mode=m;S.lv=m=='sl'?2:1;next()}
function pk(k,l){if(S.done)return;S.lt[k]=l;draw()}
function idc(v,q){return '<div class="card w"><p style="margin:0 0 .4rem">¿Qué letra (U, V o T) corresponde a cada dato?</p>'+S.ord.map(function(k){return '<div style="display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin:.3rem 0"><span style="flex:1;min-width:9rem">'+NM[k]+': <b>'+(k==q?'?':v[k])+'</b></span>'+['U','V','T'].map(function(l){return '<button class="'+(S.lt[k]==l?'on':'')+'" onclick="pk(\''+k+'\',\''+l+'\')">'+l+'</button>'}).join('')+'</div>'}).join('')+'</div>'}
function lc(){return S.lv==1?'':'<p style="margin:.2rem 0">'+(S.rL?'✓':'✗')+' Letras'+(S.rL?'':': '+['T','U','V'].map(function(k){return k+' = '+NM[k]}).join(', '))+'</p>'}
function init(){var h=S.ch,i;S.c=[];S.pool=h.T;
if(h.m=='u')for(i=0;i<h.V;i++)S.c.push(0);
if(h.m=='t'){for(i=0;i<h.V;i++)S.c.push(h.U);S.pool=0}}
function next(){
var m=S.mode=='mix'||S.mode=='sl'?['u','v','t'][R(0,2)]:S.mode,U=R(2,Math.min(7,5+Math.floor(S.ok/3))),V=R(2,Math.min(10,7+Math.floor(S.ok/2)));
S.ch={m:m,U:U,V:V,T:U*V,p:P[R(0,P.length-1)]};S.done=false;S.lt={};S.ord=['T','U','V'].sort(function(){return Math.random()-.5});S.ans=0;init();draw()}
function move(f,j){if(f<0){if(S.pool<=0)return;S.pool--}else{if(S.c[f]<=0)return;S.c[f]--}S.c[j]++}
function drop(s,el){var f=s=='p'?-1:+s,t=el&&el.closest?el.closest('[data-can],#pool,#newc'):null;
if(t){if(t.id=='pool'){if(f>=0){S.c[f]--;S.pool++}}
else if(t.id=='newc'){S.c.push(0);move(f,S.c.length-1)}
else if(+t.dataset.can!=f)move(f,+t.dataset.can)}
draw()}
var D=null;
function mv(e){if(D){D.g.style.left=e.clientX-16+'px';D.g.style.top=e.clientY-16+'px'}}
document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('.t[data-src]');if(!b||S.done||D)return;
e.preventDefault();var g=b.cloneNode(true);g.removeAttribute('data-src');g.setAttribute('class','ghost');document.body.appendChild(g);
D={s:b.dataset.src,g:g};b.style.opacity=.3;mv(e)});
document.addEventListener('pointermove',mv);
document.addEventListener('pointerup',function(e){if(!D)return;var el=document.elementFromPoint(e.clientX,e.clientY),s=D.s;D.g.remove();D=null;drop(s,el)});
document.addEventListener('pointercancel',function(){if(D){D.g.remove();D=null;draw()}});
function addCan(){if(!S.done){S.c.push(0);draw()}}
function delCan(){if(S.done||!S.c.length)return;S.pool+=S.c.pop();draw()}
function reset(){init();draw()}
function st(d){S.ans=Math.max(0,Math.min(99,S.ans+d));$('an').textContent=S.ans||'?'}
function chk(){var h=S.ch,m=h.m,e=m=='u'?h.U:m=='v'?h.V:h.T,c0=S.c[0];
S.rA=S.ans==e;
S.rB=m=='u'?(S.pool==0&&S.c.every(function(x){return x==c0})):m=='v'?(S.pool==0&&S.c.length==h.V&&S.c.every(function(x){return x==h.U})):null;
S.rL=['T','U','V'].every(function(k){return S.lt[k]==k});S.done=true;if(S.rA&&S.rB!==false&&(S.lv==1||S.rL)){S.ok++;S.streak++}else S.streak=0;draw()}
function draw(){var h=S.ch,m=h.m,q={u:'U',v:'V',t:'T'}[m],e={u:h.U,v:h.V,t:h.T}[m],g=h.p,em=g[2],o='',a=S.rA,b=S.rB,good=a&&b!==false&&(S.lv==1||S.rL);
var vals={U:h.U+' €',V:h.V,T:h.T+' €'};
if(S.lv==1||S.done)o+='<div class="chips">'+['T','U','V'].map(function(k){return '<div class="chip'+(k==q?' q':'')+'"><small>'+{T:'precio de la compra',U:'precio de cada artículo',V:'artículos'}[k]+'</small>'+k+' = '+(k==q&&!S.done?'?':vals[k])+'</div>'}).join('')+'</div>';
var pool='<div class="pool" id="pool">'+(S.pool?coin(S.pool,'p'):'<span class="sc">'+(m=='t'?'Caja: aquí van las monedas que saques':'Monedero')+'</span>')+'</div>';
var row='<div class="row">'+S.c.map(function(x,j){return '<span class="it" data-can="'+j+'"><span class="em">'+em+'</span><span class="bx">'+coin(x,j)+'</span></span>'}).join('')+(m=='v'?'<span class="newc" id="newc" onclick="addCan()">+<br>artículo<br>nuevo</span>':'')+'</div>';
var txt={u:'Has comprado '+h.V+' '+g[1]+' iguales y has pagado '+h.T+' €. <b>Arrastra</b> las monedas del monedero a los artículos para pagar lo mismo por cada uno. ¿Cuánto cuesta cada '+g[0]+'?',
v:'Tienes '+h.T+' € en monedas y cada '+g[0]+' cuesta '+h.U+' €. <b>Arrastra</b> las monedas para pagar los artículos; arrastra una al recuadro «artículo nuevo» para comprar otro. ¿Cuántos '+g[1]+' puedes comprar?',
t:'Compras '+h.V+' '+g[1]+' y cada '+g[0]+' cuesta '+h.U+' €, que se ve en monedas. <b>Arrastra</b> las monedas que hay bajo cada artículo a la caja y cuéntalas. ¿Cuánto cuesta toda la compra?'}[m];
o+='<div class="card"><p style="margin:0">'+txt+'</p>'+(m=='t'?row+pool:pool+row);
if(!S.done)o+='<div class="ctl">'+(m=='v'?'<button onclick="delCan()">Quitar artículo</button>':'')+'<button onclick="reset()">Empezar de nuevo</button></div>';
o+='</div>'+(S.lv==2&&!S.done?idc(vals,q):'')+'<div class="card w">';
if(!S.done)o+='<p style="margin:0 0 .4rem">'+(S.lv==1?'¿Cuánto vale <b>'+q+'</b>?':'Tu respuesta:')+''+{u:' (precio de cada artículo, en €)',v:' (número de artículos)',t:' (precio de la compra, en €)'}[m]+'</p><div class="ans"><button onclick="st(-1)" aria-label="menos">−</button><output id="an">'+(S.ans||'?')+'</output><button onclick="st(1)" aria-label="más">+</button><button class="pri" onclick="chk()">Terminar</button></div><p class="sc">Cuando creas que lo tienes, escribe la respuesta y pulsa Terminar.</p>';
else{o+='<p class="msg '+(good?'ok':'bad')+'">'+(good?'¡Muy bien!':'Esta vez no ha salido. Fíjate en la explicación.')+'</p>';
if(b!==null)o+='<p style="margin:.2rem 0">'+(b?'✓':'✗')+' Reparto de las monedas'+(b?'':m=='u'?': no hay las mismas en cada artículo, o quedan monedas en el monedero':': tendría que haber '+h.V+' artículos con '+h.U+' monedas cada uno')+'</p>';
o+=lc()+'<p style="margin:.2rem 0">'+(a?'✓':'✗')+' Respuesta: '+q+' = '+e+(m=='v'?'':' €')+(a?'':' (tú pusiste '+(S.ans||'nada')+')')+'</p><div class="eq">U × V = T → '+h.U+' € × '+h.V+' = '+h.T+' €</div><p style="margin:.2rem 0">'+h.V+' '+g[1]+' a '+h.U+' € cada uno cuestan '+h.T+' € en total.</p>'+(m=='t'?'':'<p style="margin:.2rem 0">'+(m=='u'?h.T+' € ÷ '+h.V+' = '+h.U+' €':h.T+' € ÷ '+h.U+' € = '+h.V)+' porque '+h.U+' × '+h.V+' = '+h.T+'.</p>')+'<div class="row">'+Array(h.V+1).join('<span class="it"><span class="em">'+em+'</span><span class="bx">'+coin(h.U,null)+'</span></span>')+'</div><div class="ctl"><button class="pri" onclick="next()">Siguiente ▶</button></div>'}
$('app').innerHTML=o+'</div>';
$('tabs').innerHTML=[['mix','🎲 Mezcla'],['u','Busca U'],['v','Busca V'],['t','Busca T'],['sl','🔍 Sin letras']].map(function(x){return '<button class="'+(S.mode==x[0]?'on':'')+'" onclick="setMode(\''+x[0]+'\')">'+x[1]+'</button>'}).join('');
$('sc').textContent='Aciertos: '+S.ok+' · Racha: '+S.streak}
next();
</script>
</body></html>
